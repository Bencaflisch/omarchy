[package]
name = "omarchy-speedtest"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
curl = { version = "=0.4.51", default-features = false, features = ["ssl"] }
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
