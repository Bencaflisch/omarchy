# Early-load the I2C HID transport on machines described by a device tree,
# where the kernel builds it as a module. Snapdragon laptops' internal keyboards
# sit on I2C, and mkinitcpio's keyboard hook adds only drivers/hid/hid-*, so the
# disk unlock prompt took no keys. As with thunderbolt, the module is named
# without ? and only when the kernel has it, since a systemd initramfs copies
# MODULES as written into modules-load.d.
if [[ -e ${OMARCHY_PROC_ROOT:-/proc}/device-tree/compatible ]] &&
  [[ $(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename i2c-hid-of 2>/dev/null) == /* ]]; then
  MODULES+=(i2c-hid-of)
fi
