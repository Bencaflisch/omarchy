name: Nightly fetch probe

# Where the stable VM image's download stops scaling on a runner: the link,
# the number of connections, or the disk.

on:
  push:
    branches: [ci/nightly-fetch-probe]

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Measure
        run: |
          sudo apt-get install -y -qq aria2 >/dev/null
          sudo chmod 1777 /mnt
          url=$(curl -fsS https://nightly.omarchy.org/stable/latest.json | jq -r .vm.url)
          size=$(curl -fsSI "$url" | awk 'tolower($1) == "content-length:" { print $2 + 0 }')
          now() { date +%s.%N; }
          rate() { echo "scale=0; $size / ($2 - $1) / 1000000" | bc; }
          report() { printf '%-34s %6.1f s %5s MB/s\n' "$1" "$(echo "$3 - $2" | bc)" "$(rate "$2" "$3")" | tee -a "$GITHUB_STEP_SUMMARY"; }
          {
            echo '```'
            echo "$(curl -fsS https://nightly.omarchy.org/cdn-cgi/trace | grep -E '^colo=') link $(cat /sys/class/net/eth0/speed 2>/dev/null || echo ?) Mb/s, $(nproc) CPUs, $(free -g | awk '/Mem:/ {print $2}') GB, /dev/shm $(df -h /dev/shm | awk 'NR==2 {print $2}')"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          t0=$(now); aria2c --quiet -x 16 -s 16 -d /mnt -o a.qcow2 "$url"; t1=$(now); sync; t2=$(now)
          report "aria2c x16 to disk" "$t0" "$t1"
          report "  ... including sync" "$t0" "$t2"
          rm -f /mnt/a.qcow2
          t0=$(now); aria2c --quiet -x 16 -s 16 -k 64M -d /dev/shm -o a.qcow2 "$url"; t1=$(now)
          report "aria2c x16 to RAM" "$t0" "$t1"
          rm -f /dev/shm/a.qcow2
          # 32 ranges at once, each into RAM at its own offset.
          parts=32; chunk=$(( (size + parts - 1) / parts ))
          truncate -s "$size" /dev/shm/b.qcow2
          t0=$(now)
          seq 0 $(( parts - 1 )) | xargs -P "$parts" -I{} bash -c '
            start=$(( {} * '"$chunk"' )); end=$(( start + '"$chunk"' - 1 ))
            curl -fsS -r "$start-$end" "'"$url"'" | dd of=/dev/shm/b.qcow2 bs=4M seek="$start" oflag=seek_bytes conv=notrunc status=none'
          t1=$(now)
          report "curl x32 ranges to RAM" "$t0" "$t1"
          rm -f /dev/shm/b.qcow2
          t0=$(now); dd if=/dev/zero of=/mnt/zero bs=4M count=1123 conv=fdatasync status=none; t1=$(now)
          report "disk write 4.7 GB, fdatasync" "$t0" "$t1"
          echo '```' >>"$GITHUB_STEP_SUMMARY"
