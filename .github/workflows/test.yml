name: Tests

# Runs ./test/all on a real Omarchy install: the VM image of the current
# release, booted fresh for the run, with this checkout's code copied in.
# The package recipes are checked out beside it, because some tests hold
# this repository's scripts against them. Nothing it runs holds a secret, so
# a fork's pull request runs the same way as ours.

on:
  pull_request:
  push:
    branches: [quattro]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # QEMU from Arch, run on the runner's KVM: Ubuntu 26.04 ships QEMU 10.2,
    # Arch the current release.
    container:
      image: archlinux:latest
      options: --device /dev/kvm
    env:
      SITE: https://nightly.omarchy.org
    steps:
      - name: Install QEMU
        run: |
          pacman -Syu --noconfirm --needed git qemu-base aria2 jq openssh
          qemu-system-x86_64 --version | head -n 1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src/omarchy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy-pkgs
          path: src/omarchy-pkgs
          persist-credentials: false

      # The image of the current release: an installed Omarchy with user
      # omarchy, built and boot-tested by omarchy-iso. It changes only when a
      # release does, so it is kept in the cache under its checksum.
      - name: Find the VM image
        id: image
        run: |
          mkdir -p image
          curl -fsS --retry 3 -o image/latest.json "$SITE/stable/latest.json"
          jq -r '"Image: Omarchy \(.omarchy_version), kernel \(.kernel)"' image/latest.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha256=$(jq -r .vm.sha256 image/latest.json)" >>"$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: image
          key: vm-image-${{ steps.image.outputs.sha256 }}

      - name: Fetch the VM image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd image
          unpacked=$(jq -r .vm.unpacked latest.json)
          for file in vmlinuz initrd cmdline; do
            curl -fsS --retry 3 -o "$file" "$unpacked$file"
          done
          url=$(jq -r .vm.url latest.json)
          curl -fsS -o /dev/null -D - -r 0-0 "$url" | grep -iE '^(cf-cache-status|cf-ray):' | tee -a "$GITHUB_STEP_SUMMARY"
          started=$SECONDS
          aria2c --quiet -x 16 -s 16 -o base.qcow2 "$url"
          echo "Fetched $(stat -c %s base.qcow2) bytes in $(( SECONDS - started )) s" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "$(jq -r .vm.sha256 latest.json)  base.qcow2" | sha256sum -c -

      # Saved from pushes only: a cache saved by a pull request is that pull
      # request's alone, and each copy is 4.5 GB.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        with:
          path: image
          key: vm-image-${{ steps.image.outputs.sha256 }}

      - name: Run the tests in the VM
        run: VM_STATE_DIR="$RUNNER_TEMP" src/omarchy/test/ci-vm image src out

      - name: Summary
        if: always()
        run: |
          [ -f out/run.log ] || exit 0
          {
            echo '```'
            sed -n '/^Skipped checks in/,$p' out/run.log
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: ignore
          retention-days: 14
